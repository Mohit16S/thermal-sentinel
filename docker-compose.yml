services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: thermal_sentinel
      POSTGRES_USER: thermal
      POSTGRES_PASSWORD: thermal_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thermal -d thermal_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://thermal:thermal_dev@postgres:5432/thermal_sentinel
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args: {NEXT_PUBLIC_API_URL: http://localhost:8000}
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
    depends_on: [backend]
volumes:
  pgdata:
